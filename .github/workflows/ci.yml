name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: xover-distributions
          path: app/build/distributions/*
          if-no-files-found: error
